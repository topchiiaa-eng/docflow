<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP как meta: GitHub Pages не позволяет задавать HTTP-заголовки (аудит F-07).
         connect-src: Supabase (REST/Auth/Realtime) и Яндекс.Метрика; script-src: тег Метрики. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mc.yandex.ru wss://mc.yandex.ru; frame-src https://mc.yandex.ru; base-uri 'none'; form-action 'self' https://accounts.google.com; object-src 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>ДокПоток — единая входящая ЭДО</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
